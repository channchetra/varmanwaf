name: "✨ Feature request / 功能请求"
description: "Propose a new capability or improvement / 提议一个新能力或改进"
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Please describe the problem you want
        solved, not just the change you have in mind — that keeps the discussion
        focused on outcomes.
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想要解决的问题
      description: What is the pain point or use case? / 痛点或使用场景是什么？
      placeholder: As an operator, I need PingWAF to ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议的方案
      description: How should it work? Config shape, API, UI, or behaviour. / 它应该如何工作？配置、API、UI 或行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
      description: Other approaches you evaluated and why they fall short. / 你评估过的其它方案及其不足。
  - type: dropdown
    id: area
    attributes:
      label: Area / 相关领域
      multiple: true
      options:
        - Detection engine (rules / ML)
        - Control plane & API
        - Web dashboard
        - Agent / data plane
        - Challenge / bot protection
        - Deployment & packaging
        - Observability / logging
        - Other / 其它
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission checks / 提交前确认
      options:
        - label: I searched existing issues and this is not a duplicate. / 我已搜索现有 issue，确认这不是重复。
          required: true
        - label: I am willing to help implement or test this. / 我愿意协助实现或测试（可选）。
          required: false
