# VarmanWAF Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Default: all-in-one mode (control plane + data plane in a single container).
# For distributed deployments, see the `varman-agent` service below.
#
# Usage:
#   docker compose up -d
#   # Dashboard: https://localhost:9080 (self-signed certificate — upload a real
#   # one under Settings → Control plane HTTPS; set VARMAN_TLS_ENABLED=false to
#   # serve plain HTTP instead)
#   # Default credentials: admin@varman.local / varman123

services:
  # ─── VarmanWAF All-in-One (control plane + data plane) ─────────────────────
  varman:
    image: sovichetra/varmanwaf:latest
    # To build from source instead of pulling the pre-built image, uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: varman
    # Stable across container recreation: the control plane re-registration
    # matches agents by hostname + API key, so a changing container-ID
    # hostname would register a fresh offline ghost on every redeploy.
    hostname: varman
    ports:
      - "80:80"       # HTTP traffic (proxied)
      - "443:443"     # HTTPS traffic (proxied)
      - "9080:9080"   # Admin dashboard + REST API
      - "9090:9090"   # gRPC control plane (agents connect here)
    environment:
      - VARMAN_DB_URL=postgres://varman:${POSTGRES_PASSWORD:-varman}@postgres:5432/varman
      - VARMAN_MODE=all-in-one
      - VARMAN_JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-32-chars}
      - VARMAN_ADMIN_ADDR=0.0.0.0:9080
      - VARMAN_GRPC_ADDR=0.0.0.0:9090
      - VARMAN_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@varman.local}
      - VARMAN_ADMIN_PASSWORD=${ADMIN_PASSWORD:-varman123}
      - VARMAN_ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      # HTTPS for the dashboard (self-signed until a certificate is uploaded).
      # Add the hostname you reach the dashboard on so the generated pair covers
      # it: VARMAN_TLS_SANS=waf.example.com
      - VARMAN_TLS_ENABLED=${TLS_ENABLED:-true}
      - VARMAN_HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-15}
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn}
      # Elasticsearch (optional — uncomment to enable log shipping)
      # - VARMAN_ES_ENABLED=true
      # - VARMAN_ES_URLS=http://elasticsearch:9200
      # - VARMAN_ES_INDEX_PREFIX=varman
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - varman-data:/var/lib/varman
      - varman-certs:/etc/varman/certs
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - varman-net

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: varman-postgres
    environment:
      - POSTGRES_USER=varman
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-varman}
      - POSTGRES_DB=varman
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varman -d varman"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - varman-net

  # ─── VarmanWAF Agent (distributed mode example) ────────────────────────────
  # Uncomment this service to run a separate data-plane agent that connects
  # to the control plane above. In this setup, change the varman service's
  # VARMAN_MODE to "server" (control plane only).
  #
  # varman-agent:
  #   image: sovichetra/varmanwaf:latest
  #   # build:
  #   #   context: .
  #   #   dockerfile: Dockerfile
  #   container_name: varman-agent
  #   entrypoint: ["varman", "agent"]
  #   command:
  #     - "--server-url=http://varman:9090"
  #     - "--api-key=${AGENT_API_KEY:-}"
  #     - "--cache-dir=/var/lib/varman/cache"
  #     - "--heartbeat-interval-secs=30"
  #     - "--fail-open=true"
  #   ports:
  #     - "8080:80"
  #     - "8443:443"
  #   environment:
  #     - RUST_LOG=${RUST_LOG:-info,sqlx=warn}
  #   depends_on:
  #     varman:
  #       condition: service_healthy
  #   volumes:
  #     - agent-data:/var/lib/varman
  #   restart: unless-stopped
  #   networks:
  #     - varman-net

volumes:
  postgres-data:
    driver: local
  varman-data:
    driver: local
  varman-certs:
    driver: local
  # agent-data:
  #   driver: local

networks:
  varman-net:
    driver: bridge
