# [basic]
# log_level = "INFO"
# name = "pingwaf"
# threads = 4
#
# [upstreams.backend]
# addrs = ["127.0.0.1:3000"]
#
# [locations.main]
# path = "/"
# upstream = "backend"
#
# [servers.http]
# addr = "0.0.0.0:80"
# locations = ["main"]
