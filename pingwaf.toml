# PingWAF Configuration
# This file configures the PingWAF all-in-one instance.
#
# Usage:
#   pingwaf all-in-one --config pingwaf.toml
#
# Keys are the command-line flags with dashes replaced by underscores
# (`--admin-addr` is `admin_addr`), in the table of the mode they belong to.
# All of them can also be set through PINGWAF_* environment variables or CLI
# flags; precedence is this file, then the environment, then the command line.
# Unknown keys are reported at startup and ignored.

[server]
# PostgreSQL connection string
db_url = "postgres://pingwaf:pingwaf@localhost:5432/pingwaf"
# REST API + dashboard listen address (served over HTTPS when tls_enabled)
admin_addr = "0.0.0.0:9080"
# Serve the REST API and dashboard over TLS (required by passkeys).
# A self-signed certificate is generated on first boot; replace it from
# Settings → Control plane HTTPS once a real certificate is available.
tls_enabled = true
# Names the generated self-signed certificate covers. Add the hostname you
# open the dashboard on, otherwise the browser warns about a name mismatch.
# tls_sans = ["waf.example.com"]
# gRPC control plane listen address (agents connect here)
grpc_addr = "0.0.0.0:9090"
# JWT signing secret (must be >= 16 characters, change in production!)
jwt_secret = "change-me-in-production"
# Default admin account seeded on first boot
admin_email = "admin@pingwaf.local"
admin_password = "pingwaf123"
# Serve the embedded dashboard (SPA) from this process
serve_frontend = true
# Settings with no command-line flag stay in the environment, e.g.
#   PINGWAF_ALLOW_REGISTRATION=true       PINGWAF_JWT_EXPIRATION_HOURS=12
#   PINGWAF_CORS_ORIGINS=https://ui...    PINGWAF_DB_MAX_CONNECTIONS=20
#   PINGWAF_METRIC_RETENTION_DAYS=30      PINGWAF_WEBHOOK_URL=https://...
#   PINGWAF_PASSKEY_ENABLED=true          PINGWAF_ES_ENABLED=true

[agent]
# Control plane gRPC URL — set by the `agent` mode; the all-in-one mode talks
# to its own loopback gRPC address (`grpc_addr` above) instead.
# server_url = "http://127.0.0.1:9090"
# API key for agent authentication (generated on first registration)
api_key = ""
# Local rule cache directory (persisted across restarts)
cache_dir = "./data/cache"
# Heartbeat interval in seconds — fallback only: the control plane hands
# agents its own interval at registration and that value takes precedence
heartbeat_interval_secs = 30
# Log shipping
log_batch_size = 100
log_flush_interval_secs = 5
max_body_log_size = 8192
# Whether to allow traffic when disconnected from control plane
fail_open = true
# Metrics shipping interval in seconds (0 disables metric shipping)
metrics_ship_interval_secs = 30

# ─── Proxy configuration (pingap mode) ───────────────────────────────────
# The sections below are read by the same binary when it runs as pingap —
# `pingwaf -c pingwaf.toml`, with no PingWAF subcommand — not by the
# `server`/`agent`/`all-in-one` modes above.
