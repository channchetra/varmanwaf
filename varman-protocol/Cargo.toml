[package]
name = "varman-protocol"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "VarmanWAF control-plane gRPC protocol definitions, generated from the single source of truth control_plane.proto."

[dependencies]
tonic = { workspace = true }
# The generated service stubs name `tonic_prost::ProstCodec` as their codec, so
# this is required at compile time of the generated module, not just at build time.
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

# These are dependencies of the generated code, not of the hand-written
# module: `control_plane.rs` names `tonic_prost::ProstCodec` and prost types,
# so cargo-machete cannot see the use from the source tree.
[package.metadata.cargo-machete]
ignored = ["prost", "prost-types", "tonic-prost"]
