[basic]
name = "waf-eval-level-normal-body"
log_level = "INFO"
threads = 2

[upstreams.mock]
addrs = ["127.0.0.1:6199"]

[locations.main]
path = "/"
upstream = "mock"
plugins = ["waf"]

[servers.http]
addr = "127.0.0.1:6188"
locations = ["main"]

[plugins.waf]
category = "waf"
mode = "block"
level = "normal"
inspect_body = true
paranoia_level = 2
anomaly_threshold = 40
